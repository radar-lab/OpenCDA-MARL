# Extend fields - only these fields will extend instead of replace
_extend_fields:
  - "world.seed" # Add to base seed for variation
  - "MARL.training.metrics_export_interval"
  - "MARL.training.metrics_export_dir"

description: |-
  This scenario focuses on intersection navigation under heavy congestion.

# Demonstrate seed extension - adds variation to base seed
world:
  seed: 5 # This will be ADDED to default.yaml seed (11) = 16 total

spectator:
  preset: "intersection_bird_eye"

meta:
  # available scenario types: intersection
  scenario_type: "intersection"
  town: "intersection_12_lane_fixed"
  # custom xodr path for this scenario
  # xodr_path: "opencda_marl/assets/maps/intersection.xodr"

# minimal scenario configuration
scenario:
  simulation:
    max_steps: 2400 # 2 minute = 20fps * 60s * 2
    max_episodes: 100
  traffic:
    # Traffic mode: 'record', 'replay', or 'live'
    mode: "replay"
    replay_file: "recordings/lite_2minL.json"
    #replay_file: "recordings/quick_test.json"
    base_speed: 45.0 # km/h base speed for vehicles
    active_junctions: [4]

    planner:
      distance: 5.0 # base spacing (m)
      spawn_offset: 7 # multiples of safe_distance upstream
      dest_offset: 7 # multiples of safe_distance downstream
      spawn_z_lift: 0.3 # small lift to avoid ground collision
      wp_step: 1.0 # stepping granularity along lanes (m)
      allow_uturn: false
      visualize:
        entry_wp: false
        exit_wp: false
        spawn_wp: false
        dest_wp: false
        route_line: false
        junction_center: true
        bbox: false
        extent_box: true
        text: true
        life_time: 10.0

    flows:
      - name: "north"
        rate_vph: 200
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "north"
        speed_variation: 0.2
        middle_peak:
          intensity: 0.4 # How much denser the peak is (0.0 = no peak, 1.0 = very dense)
          position: 0.5 # Where peak occurs (0.5 = middle of simulation)
          width: 0.3 # How wide the peak is (0.1 = narrow, 0.5 = wide)

      - name: "south"
        rate_vph: 200
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "south"
        speed_variation: 0.15
        middle_peak:
          intensity: 0.3
          position: 0.4
          width: 0.4

      - name: "east"
        rate_vph: 200
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "east"
        speed_variation: 0.1
        middle_peak:
          intensity: 0.35
          position: 0.6
          width: 0.25

      - name: "west"
        rate_vph: 200
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "west"
        speed_variation: 0.25
        middle_peak:
          intensity: 0.5
          position: 0.45
          width: 0.35

agents:
  debug: false
  agent_type: "marl"

  marl:
    # Base VanillaAgent parameters
    debug: false
    max_speed: 65 # Maximum speed for the agent (km/h)
    emergency_param: 0.4
    ignore_traffic_light: true
    collision_time_ahead: 1.5
    local_planner:
      trajectory_update_freq: 5
      debug: false
      debug_trajectory: true # Keep trajectory clean for RL

MARL:
  # Algorithm selection: q_learning, td3, sac, ppo, dqn
  algorithm: "td3"

  # Enhancement: 44D state (9D ego + 35D nearby vehicles)
  state_dim: 44
  action_dim: 1 # Continuous speed control

  # TD3 Algorithm Configuration (Multi-Agent)
  td3:
    # Feature configuration (44D total = 9D ego + 35D nearby vehicles)
    features:
      # Ego features (9D) - same as before
      rel_x: 1                        # Relative X to intersection
      rel_y: 1                        # Relative Y to intersection
      position_x: 1                   # Absolute X position
      position_y: 1                   # Absolute Y position
      lane_position: 1                # Lane position (0=intersection, 1=left, 2=middle, 3=right)
      heading_angle: 1                # Vehicle orientation (radians)
      dist_to_intersection: 1         # Distance to intersection
      dist_to_front_vehicle: 1        # Distance to front vehicle
      waypoint_buffer: 1              # Waypoint count (0-50 range)
      # Nearby vehicle features (35D = 5 vehicles x 7 features)
      # Per vehicle: rel_x, rel_y, rel_vx, rel_vy, heading_diff, distance, ttc
      nearby_vehicles: 35             # 5 closest vehicles within 50m radius

    # Nearby vehicle detection configuration
    nearby_vehicle_config:
      detection_radius: 50.0          # meters - search radius for nearby vehicles
      max_vehicles: 5                 # Maximum vehicles to track (K slots)
      features_per_vehicle: 7         # Features per vehicle slot
      include_ttc: true               # Include TTC in features
      max_relative_velocity: 40.0     # m/s (~144 km/h) - for normalization
      max_ttc: 10.0                   # seconds - TTC values clamped to this maximum

    # LSTM conflict encoder (from ITS_Sim architecture)
    conflict_encoder:
      type: "LSTM"
      input_size: 44                  # Updated from 9 to 44
      hidden_size: 256                # LSTM hidden dimension
      num_layers: 1                   # LSTM layers

    # Motion planner architecture (from AdvRAIM)
    motion_planner:
      num_layers: 5
      input_dim: [300, 1024, 1024, 512, 256]    # First: 44 + 256 = 300
      output_dim: [1024, 1024, 512, 256, 1]      # Final output: 1 (action)
    
    # Learning rates - reduced for stable training
    learning_rate_actor: 1e-3         # Actor learning rate (stable learning)
    learning_rate_critic: 1e-3        # Critic learning rate (stable convergence)
    
    # TD3 hyperparameters
    tau: 0.01                         # Soft update parameter for target networks (2x faster updates)
    discount: 0.99                    # Discount factor (gamma)
    policy_noise: 0.2                 # Noise added to target policy during critic update
    noise_clip: 0.3                   # Range to clip target policy noise
    exploration_noise: 0.3            # Initial exploration noise (reduced from 0.5 for stability)
    noise_decay: 0.995                # Decay rate per episode (reaches min ~0.05 by episode 200)
    min_exploration_noise: 0.05       # Minimum noise floor (allows exploitation)
    policy_freq: 2                    # Delayed policy updates (update actor every 2 critic updates)
    
    # Training parameters
    batch_size: 256                   # Batch size for training
    
    # Smart replay buffer configuration
    memory_size: 25000                # Sized for >1 episode (~14k) to prevent FIFO losses
    recency_ratio: 0.5                # 50% samples from recent 20% of buffer
    
    # Auto-clear configuration (prevents stale experiences and FIFO losses)
    clear_episodes: 1                 # Clear buffer after EVERY episode (prevents cap overflow)
    clear_keep_ratio: 0.6              # Keep 60% newest experiences (9k from 15k)
    # Alternative: clear_interval: 10000  # Clear every 10k transitions
    
    # Prioritized Experience Replay (PER) configuration
    use_per: true                     # Enable PER (TD-error based sampling)
    per_alpha: 0.6                    # Priority exponent (0=uniform, 1=full priority)
    per_beta: 0.4                     # Initial importance sampling correction
    per_beta_increment: 0.001         # Beta annealing rate (reaches 1.0 gradually)
    
    # Action bounds (continuous speed control in km/h) - prevents traffic jams
    max_action: 65.0                  # Maximum speed
    min_action: 10.0                  # Minimum speed (prevents stopping)
    warmup_steps: 0                 # Reduced warmup for faster TD3 takeover

  # Training configuration
  training:
    # Training control
    training_mode: true # Set to false for evaluation only (uses scenario.simulation.max_episodes)

    # Checkpoint settings
    checkpoint_dir: "checkpoints/"
    save_freq: 1
    keep_checkpoints: 3

    # Resume training / Evaluation checkpoint
    #load_checkpoint: "checkpoints/td3/latest_checkpoint.pth"
    load_checkpoint: null

  rewards:
    # Terminal rewards
    collision: -500.0 # Severe penalty to ensure safety priority
    success: 400.0 # Higher reward for reaching destination

    # Per-step rewards
    step_penalty: -1.5 # Stronger time pressure to encourage faster completion
    speed_bonus: 0.5 # Doubled bonus for maintaining speed > threshold
    speed_threshold: 45.0 # Lowered threshold (km/h) for easier bonus achievement

    # TTC-based safety reward (proactive collision avoidance)
    ttc_safe_threshold: 3.0       # seconds - no penalty above this
    ttc_caution_threshold: 2.0    # seconds - entering caution zone
    ttc_danger_threshold: 1.0     # seconds - entering danger zone
    ttc_caution_penalty: -0.5     # penalty in caution zone
    ttc_danger_penalty: -2.0      # penalty in danger zone
    ttc_critical_penalty: -5.0    # penalty in critical zone (< 1s)

    # Progress-toward-goal reward (dense feedback)
    progress_scale: 0.5           # scale factor for progress reward
    junction_threshold: 5.0       # meters - threshold for "in junction" detection

    # Stop penalty (discourage hard stops, encourage gradual deceleration)
    stop_threshold: 5.0           # km/h - below this speed is considered "stopped"
    stop_penalty: -3.0            # Penalty for stopping (encourages gradual deceleration)
