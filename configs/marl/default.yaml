description: |-
  MARL default configuration that other MARL configurations can inherit from.

# Base OpenCDA configuration
world:
  sync_mode: true
  host: 127.0.0.1
  client_port: 2000
  timeout: 20.0
  fixed_delta_seconds: 0.05 # 20 FPS
  seed: 11 # seed for numpy and random
  weather:
    sun_altitude_angle: 15 # 90 is the midday and -90 is the midnight
    cloudiness: 0 # 0 is the clean sky and 100 is the thickest cloud
    precipitation: 0 # rain, 100 is the heaviest rain
    precipitation_deposits: 0 # Determines the creation of puddles. Values range from 0 to 100, being 0 none at all and 100 a road completely capped with water.
    wind_intensity: 0 # it will influence the rain
    fog_density: 0 # fog thickness, 100 is the largest
    fog_distance: 0 # Fog start distance. Values range from 0 to infinite.
    fog_falloff: 0 # Density of the fog (as in specific mass) from 0 to infinity. The bigger the value, the more dense and heavy it will be, and the fog will reach smaller heights
    wetness: 0

scenario:
  traffic:
    # Vehicle Type Configuration
    # Using inclusion-based approach for consistent collision detection and simulation
    # Recommended: Similar-sized sedans for consistent physics and collision detection
    # ENABLED VEHICLES
    included_vehicle_types:
      - "vehicle.audi.a2"           # Compact sedan
      - "vehicle.bmw.grandtourer"   # Family sedan  
      - "vehicle.citroen.c3"        # Compact car
      - "vehicle.lincoln.mkz_2017"  # Luxury sedan
      - "vehicle.seat.leon"         # Compact sedan
    # DISABLED VEHICLES (Choose either included_vehicle_types or excluded_vehicle_types)
    excluded_vehicle_types:
      - "walker"

# Agent behavior configuration (based on OpenCDA behavior_agent)
# This config is used for all agent types (traffic, RL agents, rule-based agents)
agents:
  # Vehicle configuration for VehicleManager
  vehicle:
    sensing:
      perception:
        activate: false # when not activated, objects positions will be retrieved from server directly
        camera:
          visualize: 0 # how many camera images need to be visualized. 0 means no visualization for camera
          num: 1 # how many cameras are mounted on the vehicle
          positions: [[2.5, 0, 1.0, 0]] # relative positions (x,y,z,yaw) of the camera
        lidar: # lidar sensor configuration, check CARLA sensor reference for more details
          visualize: false

      localization:
        activate: true # when not activated, ego position will be retrieved from server directly
        use_kalman: false # Disable Kalman filter to prevent route following lag
        dt: 0.1 # used for kalman filter
        debug_helper:
          show_animation: false

    map_manager:
      visualize: false  # Enable BEV visualization (shows cv2 window for each vehicle)
      activate: false   # Activate map manager for BEV generation

    v2x:
      enabled: true
      apply_lag: false

    safety_manager:
      print_message: false

    behavior:
      debug: false
      max_speed: 45 # maximum speed, km/h (~30 mph - typical US arterial intersection speed)
      # when a vehicles needs to be close to another vehicle asap
      tailgate_speed: 50 
      # max_speed - speed_lim_dist = target speed
      speed_lim_dist: 5 
      # used in car following mode to decrease speed for distance keeping
      speed_decrease: 15
      # ttc safety thresholding for decreasing speed
      safety_time: 4
      # used to identify whether a emergency stop needed
      emergency_param: 0.4
      # whether overtake allowed, typically false for platoon leader
      overtake_allowed: true 
      # used for collision checking
      collision_time_ahead: 1.5
      # the vehicle can not do another overtake during next certain steps
      overtake_counter_recover: 35 
      # whether to ignore traffic light
      ignore_traffic_light: false # respect traffic lights in intersection scenarios
      # the unit distance between two adjacent waypoints in meter
      sample_resolution: 1.0 # waypoint distance in meters (finer for intersection navigation)
        
      # Local planner configuration (required by OpenCDA BehaviorAgent)
      local_planner:
        buffer_size: 12 # waypoint buffer size
        trajectory_update_freq: 15 # trajectory points updating frequency
        waypoint_update_freq: 9 # waypoint updating frequency
        min_dist: 2 # pop waypoints too close to current location (smaller for intersections)
        trajectory_dt: 0.10 # trajectory sampling time (faster for intersection scenarios)
        debug: true # whether to draw future/history waypoints
        debug_trajectory: true # whether to draw trajectory points and path

  vanilla:
    debug: false
    max_speed: 45 # maximum speed, km/h
    emergency_param: 0.4 # used to identify whether a emergency stop needed
    ignore_traffic_light: true # whether to ignore traffic light
    collision_time_ahead: 1.5 # used for collision checking

    local_planner:  # trajectory planning related
      trajectory_update_freq: 9 # trajectory points updating frequency
      debug: false # whether to draw future/history waypoints
      debug_trajectory: true # whether to draw the trajectory points and path

  # RuleBasedAgent configuration (3-stage rule-based with JAIR enhancements)
  rule_based:
    debug: false
    debug_rules: false
    max_speed: 65 # Maximum speed (km/h) - matches agent_behavior for consistency
    emergency_param: 0.4 # used to identify whether a emergency stop needed
    ignore_traffic_light: true # whether to ignore traffic light
    collision_time_ahead: 1.5 # used for collision checking
    local_planner:  # trajectory planning related
        trajectory_update_freq: 5 # trajectory points updating frequency
        debug: false # whether to draw future/history waypoints
        debug_trajectory: true # whether to draw the trajectory points and path

    # Stage 1: Junction Management (Enhanced with trajectory prediction & dynamic speed adjustment)
    junction_approach_distance: 70.0 # Distance to start junction management (meters)
    junction_conflict_distance: 50.0 # Distance to check for conflicting vehicles (meters)
    junction_speed_factor: 0.6 # Reduce speed to 60% at junctions (dynamic adjustment)
    junction_min_reduction: 30.0 # Minimum speed reduction at junctions (km/h)
    #~CRITICAL: previous 15.0 achieves 75%/25% success/collision rate
    # junction_min_reduction: 15.0 # Minimum speed reduction at junctions (km/h)

  
    # Trajectory-based conflict detection (replaces heading difference)
    #~CRITICAL: previous: 3.0/2.0/1.0 achieves 75%/25% success/collision rate
    trajectory_lookahead_time: 8.0 # Time horizon for trajectory prediction (seconds)
    ttc_threshold: 5.0 # Minimum TTC difference for conflict detection (seconds)
    trajectory_step_size: 3.0 # Step size for trajectory prediction (meters)
    
    # Stage 2: Car Following (Enhanced with leading vehicle speed consideration)
    #~CRITICAL: previous speed buffer/time_headway are 5.0/2.0 
    #~          achieves 75%/25% success/collision rate
    following_speed_buffer: 8.0 # Speed buffer below leading vehicle (km/h)
    time_headway: 3.0 # Time headway for safe following (seconds)
    following_gain: 0.5 # Car following controller gain
    minimum_distance_buffer: 5.0 # Minimum physical distance buffer (meters)
    same_lane_tolerance_deg: 30 # Heading tolerance for same lane detection (degrees)
    front_cone_angle_deg: 45 # Front detection cone angle (degrees)

    # Stage 3: Cruising
    #~CRITICAL: previous: 0.95 achieves 75%/25% success/collision rate
    #~Increase to 1.0 to faster when cruising
    cruising_speed_factor: 1.0 # 95% of vanilla when cruising


# Evaluation System Configuration
evaluation:
  # Evaluation modes:
  # - 'full': Detailed time-series tracking with plotting capabilities
  # - 'lightweight': Summary-only tracking for efficient training
  # - 'disabled': No evaluation tracking
  mode: "full"
  root_dir: "evaluation_outputs"
  
  # Data management
  save_interval: 1  # Save every N episodes
  compression: true   # Use compression for data storage
  
  # Memory management
  keep_last_n_files: 0  # Keep only last N episode files (0 = keep all)
  keep_summaries: 1000  # Number of episode summaries to retain in memory (lightweight mode)
  
  # Visualization settings
  plot_interval: 5    # Generate plots every N episodes (full mode only)
