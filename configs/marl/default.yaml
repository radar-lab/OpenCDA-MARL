description: |-
  MARL default configuration - contains common settings shared by all agents.
  Agent-specific configurations inherit from this file via OmegaConf merge.

# Base OpenCDA world configuration
world:
  sync_mode: true
  host: 127.0.0.1
  client_port: 2000
  timeout: 20.0
  fixed_delta_seconds: 0.05 # 20 FPS
  seed: 11 # seed for numpy and random
  weather:
    sun_altitude_angle: 15 # 90 is the midday and -90 is the midnight
    cloudiness: 0 # 0 is the clean sky and 100 is the thickest cloud
    precipitation: 0 # rain, 100 is the heaviest rain
    precipitation_deposits: 0 # Determines the creation of puddles. Values range from 0 to 100
    wind_intensity: 0 # it will influence the rain
    fog_density: 0 # fog thickness, 100 is the largest
    fog_distance: 0 # Fog start distance. Values range from 0 to infinite.
    fog_falloff: 0 # Density of the fog from 0 to infinity
    wetness: 0

# Spectator view preset
spectator:
  preset: "intersection_bird_eye"

# Scenario metadata
meta:
  scenario_type: "intersection"
  town: "intersection_12_lane_fixed"

# Scenario configuration (shared across all agents)
scenario:
  simulation:
    max_steps: 2400 # 2 minute = 20fps * 60s * 2
    max_episodes: 1000

  traffic:
    # Traffic mode: 'record', 'replay', or 'live'
    mode: "live"
    replay_file: "recordings/traffic_400vph.json"
    base_speed: 55.0 # km/h base speed for vehicles
    active_junctions: [4]

    # Vehicle Type Configuration
    included_vehicle_types:
      - "vehicle.audi.a2"
      - "vehicle.bmw.grandtourer"
      - "vehicle.citroen.c3"
      - "vehicle.lincoln.mkz_2017"
      - "vehicle.seat.leon"
    excluded_vehicle_types:
      - "walker"

    planner:
      distance: 5.0 # base spacing (m)
      spawn_offset: 7 # multiples of safe_distance upstream
      dest_offset: 7 # multiples of safe_distance downstream
      spawn_z_lift: 0.3 # small lift to avoid ground collision
      wp_step: 1.0 # stepping granularity along lanes (m)
      allow_uturn: false
      visualize:
        entry_wp: false
        exit_wp: false
        spawn_wp: false
        dest_wp: false
        route_line: false
        junction_center: true
        bbox: false
        extent_box: true
        text: true
        life_time: 10.0

    flows:
      - name: "north"
        rate_vph: 300
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "north"
        speed_variation: 0.2
        middle_peak:
          intensity: 0.4
          position: 0.5
          width: 0.3

      - name: "south"
        rate_vph: 300
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "south"
        speed_variation: 0.15
        middle_peak:
          intensity: 0.3
          position: 0.4
          width: 0.4

      - name: "east"
        rate_vph: 300
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "east"
        speed_variation: 0.1
        middle_peak:
          intensity: 0.35
          position: 0.6
          width: 0.25

      - name: "west"
        rate_vph: 300
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "west"
        speed_variation: 0.25
        middle_peak:
          intensity: 0.5
          position: 0.45
          width: 0.35

# Base vehicle configuration (sensing, localization - shared by all agents)
agents:
  debug: false

  vehicle:
    sensing:
      perception:
        activate: false
        camera:
          visualize: 0
          num: 1
          positions: [[2.5, 0, 1.0, 0]]
        lidar:
          visualize: false

      localization:
        activate: true
        use_kalman: false
        dt: 0.1
        debug_helper:
          show_animation: false

    map_manager:
      visualize: false
      activate: false

    v2x:
      enabled: true
      apply_lag: false

    safety_manager:
      print_message: false

    behavior:
      debug: false
      max_speed: 45
      tailgate_speed: 50
      speed_lim_dist: 5
      speed_decrease: 15
      safety_time: 4
      emergency_param: 0.4
      overtake_allowed: true
      collision_time_ahead: 1.5
      overtake_counter_recover: 35
      ignore_traffic_light: false
      sample_resolution: 1.0

      local_planner:
        buffer_size: 12
        trajectory_update_freq: 15
        waypoint_update_freq: 9
        min_dist: 2
        trajectory_dt: 0.10
        debug: true
        debug_trajectory: true

# Evaluation System Configuration
evaluation:
  mode: "full"
  root_dir: "evaluation_outputs"
  save_interval: 1
  compression: true
  keep_last_n_files: 0
  keep_summaries: 1000
  plot_interval: 5

# TensorBoard Configuration
tensorboard:
  enabled: true
  log_dir: "runs"
  log_frequency: 1
  metrics:
    losses: true
    q_values: true
    buffer: true
    episode: true
    rewards: true

# MARL training base configuration
MARL:
  training:
    metrics_export_interval: 5
    metrics_export_dir: "metrics_history"

# CARLA World Reset Configuration
world_reset:
  reset_frequency: 10
  auto_reset:
    enabled: true
    slowdown_threshold: 1.5
    monitoring_window: 100
    min_epochs_before_auto: 3
  log_reset_events: true
  log_step_times: true
