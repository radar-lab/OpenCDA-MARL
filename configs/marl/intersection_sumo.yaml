# SUMO-only MARL Training Configuration
# Fast pre-training for transfer learning to CARLA

description: |-
  SUMO-only MARL training for intersection navigation.
  Uses TraCI for 10-80x faster training compared to CARLA.
  Trained policies can be transferred to CARLA for fine-tuning.

meta:
  scenario_type: "intersection_sumo"  # New scenario type for SUMO-only
  simulator: "sumo"  # Flag to use SUMO instead of CARLA
  sumo_cfg: "opencda_marl/assets/intersection_sumo/intersection.sumocfg"

world:
  sync_mode: true
  fixed_delta_seconds: 0.05
  seed: 11
  sumo_port: 8873

  # SUMO GUI Visualization
  # Set to true to see traffic simulation in SUMO GUI window
  # GUI will auto-start (non-blocking) - no manual "Play" button needed
  # Useful for debugging vehicle behaviors and traffic patterns
  sumo_gui: true

scenario:
  simulation:
    max_steps: 2400  # 2 minutes at 20fps (2400 steps * 0.05s)
    max_episodes: 1000  # Fast training: 1000 episodes in SUMO

  traffic:
    mode: "live"  # Generate traffic dynamically
    base_speed: 45.0  # km/h base speed

    flows:
      - name: "north"
        rate_vph: 200
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "north"
        speed_variation: 0.2
        middle_peak:
          intensity: 0.4
          position: 0.5
          width: 0.3

      - name: "south"
        rate_vph: 200
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "south"
        speed_variation: 0.15
        middle_peak:
          intensity: 0.3
          position: 0.4
          width: 0.4

      - name: "east"
        rate_vph: 200
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "east"
        speed_variation: 0.1
        middle_peak:
          intensity: 0.35
          position: 0.6
          width: 0.25

      - name: "west"
        rate_vph: 200
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "west"
        speed_variation: 0.25
        middle_peak:
          intensity: 0.5
          position: 0.45
          width: 0.35

agents:
  count: 10  # Start with 10 agents (can scale to 50+ in SUMO)
  agent_type: "marl"

  marl:
    max_speed: 65  # km/h
    emergency_param: 0.4
    ignore_traffic_light: true
    collision_time_ahead: 1.5

MARL:
  algorithm: "td3"  # Use TD3 for continuous control

  state_dim: 9  # Auto-calculated from features
  action_dim: 1  # Continuous speed control

  # TD3 Configuration (same as CARLA for transfer learning)
  td3:
    # Feature configuration (must match CARLA for transfer)
    features:
      rel_x: 1
      rel_y: 1
      position_x: 1
      position_y: 1
      lane_position: 1
      heading_angle: 1
      dist_to_intersection: 1
      dist_to_front_vehicle: 1
      waypoint_buffer: 1

    # LSTM conflict encoder
    conflict_encoder:
      type: "LSTM"
      input_size: 9
      hidden_size: 256
      num_layers: 1

    # Motion planner architecture
    motion_planner:
      num_layers: 5
      input_dim: [265, 1024, 1024, 512, 256]
      output_dim: [1024, 1024, 512, 256, 1]

    # Learning rates (same as CARLA)
    learning_rate_actor: 1e-3
    learning_rate_critic: 1e-3

    # TD3 hyperparameters
    tau: 0.01
    discount: 0.99
    policy_noise: 0.2
    noise_clip: 0.3
    exploration_noise: 0.5  # Higher exploration in SUMO
    policy_freq: 2

    # Training parameters
    batch_size: 256

    # Smart replay buffer
    memory_size: 25000
    recency_ratio: 0.5

    # Auto-clear configuration
    clear_episodes: 1
    clear_keep_ratio: 0.6

    # PER configuration
    use_per: true
    per_alpha: 0.6
    per_beta: 0.4
    per_beta_increment: 0.001

    # Action bounds
    max_action: 65.0  # km/h
    min_action: 30.0  # km/h
    warmup_steps: 500

  # Training configuration
  training:
    training_mode: true  # Enable training

    # Checkpoint settings
    checkpoint_dir: "checkpoints/sumo_td3/"
    save_freq: 10  # Save every 10 episodes (faster than CARLA)
    keep_checkpoints: 5

    # Resume training (set to null for fresh start)
    load_checkpoint: null
    # load_checkpoint: "checkpoints/sumo_td3/latest_checkpoint.pth"

  # Reward parameters (same as CARLA for consistency)
  rewards:
    collision: -500.0
    success: 400.0
    step_penalty: -1.5
    speed_bonus: 0.5
    speed_threshold: 45.0  # km/h
