description: |-
  TD3 (Twin Delayed DDPG) deep reinforcement learning agent.
  Continuous action space with LSTM conflict encoder.

_extend_fields:
  - "world.seed"
  - "MARL.training.metrics_export_interval"
  - "MARL.training.metrics_export_dir"

world:
  seed: 5 # Added to default seed (11) = 16 total

agents:
  agent_type: "marl"

  marl:
    debug: false
    max_speed: 65 # km/h
    emergency_param: 0.4
    ignore_traffic_light: true
    collision_time_ahead: 1.5

    local_planner:
      trajectory_update_freq: 5
      debug: false
      debug_trajectory: true

MARL:
  algorithm: "td3"

  # State/Action dimensions
  state_dim: 44 # 9D ego + 35D nearby vehicles
  action_dim: 1 # Continuous speed control

  td3:
    # Feature configuration (44D total)
    features:
      rel_x: 1
      rel_y: 1
      position_x: 1
      position_y: 1
      lane_position: 1
      heading_angle: 1
      dist_to_intersection: 1
      dist_to_front_vehicle: 1
      waypoint_buffer: 1
      nearby_vehicles: 35 # 5 vehicles x 7 features

    # Nearby vehicle detection
    nearby_vehicle_config:
      detection_radius: 50.0
      max_vehicles: 5
      features_per_vehicle: 7
      include_ttc: true
      max_relative_velocity: 40.0
      max_ttc: 10.0

    # LSTM conflict encoder
    conflict_encoder:
      type: "LSTM"
      input_size: 44
      hidden_size: 256
      num_layers: 1

    # Motion planner architecture
    motion_planner:
      num_layers: 5
      input_dim: [300, 1024, 1024, 512, 256]
      output_dim: [1024, 1024, 512, 256, 1]

    # Learning rates
    learning_rate_actor: 1e-3
    learning_rate_critic: 1e-3

    # TD3 hyperparameters
    tau: 0.01
    discount: 0.99
    policy_noise: 0.2
    noise_clip: 0.3
    exploration_noise: 0.3
    noise_decay: 0.995
    min_exploration_noise: 0.05
    policy_freq: 2

    # Training parameters
    batch_size: 256

    # Replay buffer
    memory_size: 25000
    recency_ratio: 0.5
    clear_episodes: 1
    clear_keep_ratio: 0.6

    # Prioritized Experience Replay
    use_per: true
    per_alpha: 0.6
    per_beta: 0.4
    per_beta_increment: 0.001

    # Action bounds (km/h)
    max_action: 65.0
    min_action: 10.0
    warmup_steps: 0

  training:
    training_mode: true
    checkpoint_dir: "checkpoints/"
    save_freq: 1
    keep_checkpoints: 3
    load_checkpoint: null

  rewards:
    # Terminal rewards
    collision: -500.0
    success: 400.0

    # Per-step rewards
    step_penalty: -1.5
    speed_bonus: 0.5
    speed_threshold: 45.0

    # TTC-based safety reward
    ttc_safe_threshold: 3.0
    ttc_caution_threshold: 2.0
    ttc_danger_threshold: 1.0
    ttc_caution_penalty: -0.5
    ttc_danger_penalty: -2.0
    ttc_critical_penalty: -5.0

    # Progress reward
    progress_scale: 0.5
    junction_threshold: 5.0

    # Stop penalty
    stop_threshold: 5.0
    stop_penalty: -3.0
