# MAPPO Agent Configuration for Paper Experiments
# Multi-Agent Proximal Policy Optimization - future extension

_base_: "../default.yaml"

description: |-
  MAPPO MARL agent for paper experiments.
  Multi-Agent PPO with centralized critic and decentralized actors.

  STATUS: PLACEHOLDER - Implementation pending

agents:
  agent_type: "marl"

  marl:
    debug: false
    max_speed: 65
    emergency_param: 0.4
    ignore_traffic_light: true
    collision_time_ahead: 1.5
    local_planner:
      trajectory_update_freq: 5
      debug: false
      debug_trajectory: false

MARL:
  algorithm: "mappo"  # Not yet implemented
  state_dim: 44
  action_dim: 1

  # MAPPO configuration (placeholder)
  mappo:
    # Actor-Critic architecture
    actor_hidden_dims: [256, 128]
    critic_hidden_dims: [256, 128]

    # PPO hyperparameters
    clip_epsilon: 0.2
    entropy_coef: 0.01
    value_coef: 0.5
    max_grad_norm: 0.5

    # Learning rates
    actor_lr: 3e-4
    critic_lr: 1e-3

    # GAE parameters
    gamma: 0.99
    gae_lambda: 0.95

    # Training parameters
    n_steps: 2048
    n_epochs: 10
    batch_size: 64

  training:
    training_mode: true
    checkpoint_dir: "checkpoints/paper/mappo/"
    save_freq: 1
    keep_checkpoints: 5
    load_checkpoint: null
