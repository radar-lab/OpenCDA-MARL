# Rule-Based Agent Configuration for Paper Experiments
# 3-stage hierarchical control with TTC + FCFS - strong baseline

_base_: "../default.yaml"

description: |-
  Rule-based agent baseline for paper experiments.
  3-stage hierarchical control: Junction Management, Car Following, Cruising.
  Enhanced with trajectory prediction and FCFS conflict resolution.

agents:
  agent_type: "rule_based"

  rule_based:
    debug: false
    debug_rules: false
    max_speed: 65
    emergency_param: 0.4
    ignore_traffic_light: true
    collision_time_ahead: 1.5
    local_planner:
      trajectory_update_freq: 5
      debug: false
      debug_trajectory: false

    # Stage 1: Junction Management
    junction_approach_distance: 70.0
    junction_conflict_distance: 50.0
    junction_speed_factor: 0.6
    junction_min_reduction: 30.0

    # Trajectory-based conflict detection
    trajectory_lookahead_time: 8.0
    ttc_threshold: 5.0
    trajectory_step_size: 3.0

    # Stage 2: Car Following
    following_speed_buffer: 8.0
    time_headway: 3.0
    following_gain: 0.5
    minimum_distance_buffer: 5.0
    same_lane_tolerance_deg: 30
    front_cone_angle_deg: 45

    # Stage 3: Cruising
    cruising_speed_factor: 1.0
