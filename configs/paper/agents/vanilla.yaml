# Vanilla Agent Configuration for Paper Experiments
# Basic collision avoidance agent - baseline comparison

_base_: "../default.yaml"

description: |-
  Vanilla agent baseline for paper experiments.
  Basic autonomous driving with collision avoidance.

agents:
  agent_type: "vanilla"

  vanilla:
    debug: false
    max_speed: 45
    emergency_param: 0.4
    ignore_traffic_light: true
    collision_time_ahead: 1.5
    local_planner:
      trajectory_update_freq: 9
      debug: false
      debug_trajectory: false
