# Paper Experiment Default Configuration
# All agent configs in configs/paper/agents/ extend this file
#
# This provides consistent settings for fair comparison across:
# - Baseline agents: behavior, vanilla, rule_based
# - MARL agents: td3, dqn, mappo (future)

description: |-
  Paper experiment baseline configuration for 12-lane intersection.
  Dense traffic scenario to demonstrate MARL learning advantage.

# Extend fields - only these fields will extend instead of replace
_extend_fields:
  - "world.seed"
  - "MARL.training.metrics_export_interval"
  - "MARL.training.metrics_export_dir"

world:
  seed: 42  # Fixed seed for reproducibility

spectator:
  preset: "intersection_bird_eye"

meta:
  scenario_type: "intersection"
  town: "intersection_12_lane_fixed"

# Simulation configuration (same for all agents)
scenario:
  simulation:
    max_steps: 2400    # 2 minutes = 20fps * 60s * 2
    max_episodes: 100  # Adjust per experiment

  traffic:
    mode: "replay"
    replay_file: "recordings/lite_2minL.json"
    base_speed: 45.0   # km/h base speed for vehicles
    active_junctions: [4]

    planner:
      distance: 5.0
      spawn_offset: 7
      dest_offset: 7
      spawn_z_lift: 0.3
      wp_step: 1.0
      allow_uturn: false
      visualize:
        entry_wp: false
        exit_wp: false
        spawn_wp: false
        dest_wp: false
        route_line: false
        junction_center: true
        bbox: false
        extent_box: true
        text: true
        life_time: 10.0

    # Dense traffic configuration (challenging scenario)
    flows:
      - name: "north"
        rate_vph: 300          # INCREASED from 200 for challenge
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "north"
        speed_variation: 0.2
        middle_peak:
          intensity: 0.6       # INCREASED from 0.4
          position: 0.5
          width: 0.3

      - name: "south"
        rate_vph: 300          # INCREASED from 200
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "south"
        speed_variation: 0.15
        middle_peak:
          intensity: 0.5       # INCREASED from 0.3
          position: 0.4
          width: 0.4

      - name: "east"
        rate_vph: 300          # INCREASED from 200
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "east"
        speed_variation: 0.1
        middle_peak:
          intensity: 0.55      # INCREASED from 0.35
          position: 0.6
          width: 0.25

      - name: "west"
        rate_vph: 300          # INCREASED from 200
        lanes: [0, 1, 2]
        start_step: 0
        end_step: 2400
        direction: "west"
        speed_variation: 0.25
        middle_peak:
          intensity: 0.6       # INCREASED from 0.5
          position: 0.45
          width: 0.35

# Default agent settings (can be overridden in agent-specific configs)
agents:
  debug: false
  vehicle:
    sensing:
      perception:
        activate: false
      localization:
        activate: true
        use_kalman: false

# MARL settings (shared rewards for fair comparison)
MARL:
  # Safety-first reward configuration
  # Designed to reduce oscillation and demonstrate learning
  rewards:
    # Terminal rewards
    collision: -500.0      # Strong deterrent
    success: 300.0         # Slightly reduced from 400

    # Per-step rewards (rebalanced for safety)
    step_penalty: -0.5     # REDUCED from -1.5 (less rush pressure)
    speed_bonus: 0.0       # DISABLED (no speed incentive during learning)
    speed_threshold: 40.0
    stop_penalty: -1.0     # REDUCED from -3.0 (safety stops OK)
    stop_threshold: 5.0

    # TTC rewards STRENGTHENED (proactive safety)
    ttc_safe_threshold: 4.0       # INCREASED from 3.0
    ttc_caution_threshold: 2.5    # INCREASED from 2.0
    ttc_danger_threshold: 1.5     # INCREASED from 1.0
    ttc_caution_penalty: -2.0     # INCREASED from -0.5
    ttc_danger_penalty: -8.0      # INCREASED from -2.0
    ttc_critical_penalty: -15.0   # INCREASED from -5.0

    # Progress reward (encourage goal-seeking)
    progress_scale: 1.0           # INCREASED from 0.5
    junction_threshold: 5.0

  # Training defaults (can be overridden per agent)
  training:
    metrics_export_interval: 5
    metrics_export_dir: "metrics_history/paper"
