site_name: OpenCDA-MARL
site_description: Multi-Agent Reinforcement Learning for Cooperative Autonomous Driving
site_author: OpenCDA-MARL
repo_url: https://github.com/radar-lab/opencda-marl
repo_name: opencda-marl

theme:
  name: material
  logo: images/logo.PNG
  favicon: images/favicon.ico
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.prefetch
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
    - toc.integrate

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          # mermaid2's own formatter emits <div class="mermaid"> with raw
          # (unescaped) source; fence_code_format emits <pre><code> with
          # HTML-escaped arrows, which the plugin's loader fails to render.
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - meta
  - git-revision-date-localized:
      type: date
  - mermaid2

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
      - CARLA Version Support: carla-version-support.md
  - Guide:
      - Architecture: marl/architecture.md
      - Run Experiments: run-experiments.md
      - Training Throughput: marl/throughput.md
      - Customize:
          - Replace a Component: marl/replace_component.md
          - Add an Algorithm: marl/custom_algorithms.md
          - A Planner: marl/custom_planner.md
          - An Agent Type: marl/custom_agent.md
          - An Intent Provider: marl/custom_intent_provider.md
          - An Observation Extractor: marl/custom_observation_extractor.md
          - A Reward Calculator: marl/custom_reward_calculator.md
          - Profile Tables: marl/custom_profiles.md
  - Reference:
      - PCMA Learners: marl/pcma.md
      - OpenCDA Patch Ledger: opencda/marl_patches.md
      - Contributing: contributing.md
      - Changelog:
          - v2.2.0: marl/changelog/v2.2.0.md
          - v2.1.0: marl/changelog/v2.1.0.md
          - v1.0.0: marl/changelog/v1.0.0.md
  - About: about.md

# The agent docs stay built at their URLs (README and the agent portal link
# them) but out of the human nav: agents read them from the checkout via
# AGENTS.md, not from the site.
not_in_nav: |
  agents/workflow.md
  agents/code-index.md
  agents/conventions.md

extra:
  homepage: https://github.com/radar-lab/opencda-marl
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/radar-lab/opencda-marl
      name: GitHub Repository
    - icon: fontawesome/solid/globe
      link: https://opencda-documentation.readthedocs.io/en/latest/
      name: OpenCDA Documentation
    - icon: fontawesome/solid/university
      link: https://radar.ece.arizona.edu/
      name: UA Radar Lab
  # version:
  #   provider: mike  # Enable when using mike for versioned docs deployment
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/radar-lab/opencda-marl/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">telling us what you need</a>.

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  # polyfill.io was dropped in 2024: the domain changed hands and began serving
  # malicious payloads. MathJax 3 needs no ES6 polyfill in supported browsers.
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
